name: variamos_ms_notifications-main-aws-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{vars.ACR_DOKCERHUB}}
          username: ${{secrets.ACRUSERNAME_DOKCERHUB}}
          password: ${{secrets.ACRUSERPASSWORD_DOKCERHUB}}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.ACR_DOKCERHUB}}/${{secrets.ACRUSERNAME_DOKCERHUB}}/variamos_ms_notifications:main
          file: ./Dockerfile

      - name: Record the deployment start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy changes into the server
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master of 2026-08-16: v1.2.5 plus the drone-ssh checksum check
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            echo "Injecting GitHub Secrets into environment..."
            sed -i -E '/^(VARIAMOS_MS_NOTIFICATIONS_PORT|VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT|NOTIFICATION_INTERNAL_TOKEN)=/d' .env.aws.develop
            echo "VARIAMOS_MS_NOTIFICATIONS_PORT=\"${{ vars.VARIAMOS_MS_NOTIFICATIONS_PORT }}\"" >> .env.aws.develop
            echo "VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT=\"${{ vars.VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT }}\"" >> .env.aws.develop
            echo "NOTIFICATION_INTERNAL_TOKEN=\"${{ secrets.NOTIFICATION_INTERNAL_TOKEN }}\"" >> .env.aws.develop

            echo "Executing command on remote server..."
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml pull variamos_ms_notifications
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate variamos_ms_notifications
            docker image prune -f

      # Alert only (T-25, decision D6): a red run on main warns whoever merged;
      # nothing is rolled back. The new container must answer the /health
      # contract with UP, and have started after the deployment began.
      - name: Check the deployed service answers
        env:
          HEALTH_URL: https://app.variamos.com/variamos_ms_notifications/health
          SERVICE_NAME: variamos_ms_notifications
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            body=$(curl -sS --max-time 10 "$HEALTH_URL" || true)
            # A container left from before this deployment has a longer uptime
            max_uptime=$(( $(date +%s) - DEPLOY_STARTED_AT + 60 ))
            if echo "$body" | jq -e --arg name "$SERVICE_NAME" --argjson max "$max_uptime" \
              '.serviceName == $name and .status == "UP" and .uptimeSeconds <= $max' >/dev/null 2>&1; then
              echo "$SERVICE_NAME is UP: $(echo "$body" | jq -c '{status, version, uptimeSeconds}')"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$SERVICE_NAME did not answer UP from the new container within 5 minutes"
              echo "Last answer: $(echo "$body" | head -c 500)"
              exit 1
            fi
            sleep 10
          done
