# DOKCERHUB: name of the organization's registry secrets, shared by many repositories
# cspell:ignore DOKCERHUB
# Last updated: 20260831:23:05

name: variamos_ms_notifications-main-aws-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment at a time (bin/deploy also holds a lock on the server). A run
# waits for the one in progress; a newer push replaces a run still waiting.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: "ubuntu-latest"
    # The deploy key, its account and the host key live in this environment,
    # limited to main (ADR-0004)
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{vars.ACR_DOKCERHUB}}
          username: ${{secrets.ACRUSERNAME_DOKCERHUB}}
          password: ${{secrets.ACRUSERPASSWORD_DOKCERHUB}}

      # The image is checked before it is published (SPC-2026-11-18-001, lot
      # Q1): a secret, an environment file, a key or a critical flaw that has
      # a fix stops the run here, and production keeps its image.
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: image-to-check
          file: ./Dockerfile

      # Trivy (secrets, critical flaws that have a fix), then no environment
      # file and no key: the same check as in the pull requests
      - name: Check the image
        run: |
          bash scripts/scan-image.sh image-to-check

      # The image pushed is the one checked, not a new build
      - name: Push the container image to registry
        env:
          IMAGE: ${{vars.ACR_DOKCERHUB}}/${{secrets.ACRUSERNAME_DOKCERHUB}}/variamos_ms_notifications:main
        run: |
          docker tag image-to-check "$IMAGE"
          docker push "$IMAGE"

      # One SSH call. The deploy key of this repository can only run
      # "deploy SERVICE" on the server (forced command, variamos_server
      # bin/deploy): it pulls the image, recreates the service, waits until
      # it is healthy and otherwise puts back the previous image. The
      # rollback is the one of bin/deploy. This repository sends no value:
      # its token, shared with the admin, and its port stay on the server
      # (ADR-0004).
      - name: Deploy changes into the server
        env:
          SSH_HOST: ${{ secrets.AWS_HOST }}
          SSH_USER: ${{ secrets.AWS_USERNAME }}
          SSH_KEY: ${{ secrets.VARIAMOS_AWS_PEM }}
          SSH_HOST_KEY: ${{ vars.VARIAMOS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Only the deploy account has the forced command: with another one,
          # the values would reach a shell
          if [ "$SSH_USER" != deploy ]; then
            echo "::error::AWS_USERNAME must be deploy (environment production)"
            exit 1
          fi
          if [ -z "$SSH_HOST_KEY" ]; then
            echo "::error::VARIAMOS_SSH_KNOWN_HOSTS is not set (environment production)"
            exit 1
          fi
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_KEY" > "$d/key"
          chmod 600 "$d/key"
          # The host key is checked: no address in the file, an alias instead
          printf 'variamos-production %s\n' "$SSH_HOST_KEY" > "$d/known_hosts"
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o HostKeyAlias=variamos-production \
            -o UserKnownHostsFile="$d/known_hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" \
            sudo /opt/variamos/bin/deploy variamos_ms_notifications < /dev/null

      # bin/deploy already waited for a healthy container; this checks the
      # public route through nginx. A failure here leaves the run red without
      # rollback: the container is healthy, look at nginx first.
      - name: Check the deployed service answers
        env:
          HEALTH_URL: https://app.variamos.com/variamos_ms_notifications/health
          SERVICE_NAME: variamos_ms_notifications
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            body=$(curl -sS --max-time 10 "$HEALTH_URL" || true)
            if echo "$body" | jq -e --arg name "$SERVICE_NAME" \
              '.serviceName == $name and .status == "UP"' >/dev/null 2>&1; then
              echo "$SERVICE_NAME is UP: $(echo "$body" | jq -c '{status, version, uptimeSeconds}')"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$SERVICE_NAME did not answer UP through nginx within 5 minutes"
              echo "Last answer: $(echo "$body" | head -c 500)"
              exit 1
            fi
            sleep 10
          done
