name: variamos_ms_notifications-main-aws-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{vars.ACR_DOKCERHUB}}
          username: ${{secrets.ACRUSERNAME_DOKCERHUB}}
          password: ${{secrets.ACRUSERPASSWORD_DOKCERHUB}}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.ACR_DOKCERHUB}}/${{secrets.ACRUSERNAME_DOKCERHUB}}/variamos_ms_notifications:main
          file: ./Dockerfile

      - name: Record the deployment start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy changes into the server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            echo "Injecting GitHub Secrets into environment..."
            sed -i -E '/^(VARIAMOS_MS_NOTIFICATIONS_PORT|VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT|NOTIFICATION_INTERNAL_TOKEN)=/d' .env.aws.develop
            echo "VARIAMOS_MS_NOTIFICATIONS_PORT=\"${{ vars.VARIAMOS_MS_NOTIFICATIONS_PORT }}\"" >> .env.aws.develop
            echo "VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT=\"${{ vars.VARIAMOS_MS_NOTIFICATIONS_INTERNAL_PORT }}\"" >> .env.aws.develop
            echo "NOTIFICATION_INTERNAL_TOKEN=\"${{ secrets.NOTIFICATION_INTERNAL_TOKEN }}\"" >> .env.aws.develop

            echo "Executing command on remote server..."
            # Keep the image in service: the rollback step puts it back (D6)
            previous=$(docker inspect -f '{{.Image}}' "$(docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml ps -q variamos_ms_notifications)" 2>/dev/null || true)
            if [ -n "$previous" ]; then docker tag "$previous" variamos_ms_notifications:rollback; fi
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml pull variamos_ms_notifications
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate variamos_ms_notifications
            docker image prune -f

      # The new container must answer the /health contract with UP, and have
      # started after the deployment began. Otherwise the previous image is
      # put back and the run stays red (T-25, decision D6).
      - name: Check the deployed service answers
        id: health
        env:
          HEALTH_URL: https://app.variamos.com/variamos_ms_notifications/health
          SERVICE_NAME: variamos_ms_notifications
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            body=$(curl -sS --max-time 10 "$HEALTH_URL" || true)
            # A container left from before this deployment has a longer uptime
            max_uptime=$(( $(date +%s) - DEPLOY_STARTED_AT + 60 ))
            if echo "$body" | jq -e --arg name "$SERVICE_NAME" --argjson max "$max_uptime" \
              '.serviceName == $name and .status == "UP" and .uptimeSeconds <= $max' >/dev/null 2>&1; then
              echo "$SERVICE_NAME is UP: $(echo "$body" | jq -c '{status, version, uptimeSeconds}')"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$SERVICE_NAME did not answer UP from the new container within 5 minutes"
              echo "Last answer: $(echo "$body" | head -c 500)"
              exit 1
            fi
            sleep 10
          done

      # A migration is not undone: the previous code must accept the schema
      # left by the new one, as every migration so far does
      - name: Roll back to the previous image
        id: rollback
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            set -e
            container=$(docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml ps -q variamos_ms_notifications)
            if ! docker image inspect variamos_ms_notifications:rollback >/dev/null 2>&1; then
              echo "No previous image kept: nothing to roll back to"
              exit 1
            fi
            if [ "$(docker inspect -f '{{.Image}}' "$container")" = "$(docker image inspect -f '{{.Id}}' variamos_ms_notifications:rollback)" ]; then
              echo "The service still runs the previous image: nothing was rolled back"
              exit 1
            fi
            # The compose file names the image: that name points back to the previous one
            docker tag variamos_ms_notifications:rollback "$(docker inspect -f '{{.Config.Image}}' "$container")"
            docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate --pull never variamos_ms_notifications
            echo "Rolled back to the previous image"

      - name: Check the rolled back service answers
        if: failure() && steps.rollback.outcome == 'success'
        env:
          HEALTH_URL: https://app.variamos.com/variamos_ms_notifications/health
          SERVICE_NAME: variamos_ms_notifications
        run: |
          deadline=$(( $(date +%s) + 300 ))
          until curl -sS --max-time 10 "$HEALTH_URL" | jq -e --arg name "$SERVICE_NAME" \
            '.serviceName == $name and .status == "UP"' >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$SERVICE_NAME does not answer UP after the rollback either"
              exit 1
            fi
            sleep 10
          done
          echo "::warning::$SERVICE_NAME was rolled back to the previous image and answers UP"
