name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # No lifecycle script of the dependencies runs (Husky is not needed here)
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies (gated by audit-exceptions.json)
      run: |
        node scripts/audit-gate.mjs

    - name: Run linter and formatter (Biome)
      run: |
        npm run lint

    # Spelling of code, docs, workflows, scripts and Docker files (American English)
    - name: Check spelling (cspell)
      run: |
        npm run spell

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    # Unused files, exports and dependencies: knip exits with an error on any finding
    - name: Find dead code (knip)
      run: |
        npm run find-deadcode

    - name: Run unit tests with the coverage thresholds
      run: |
        npm run test:cov

    # The organization's token is not given to Dependabot pull requests
    - name: Analyze with SonarCloud, coverage included
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      # trufflehog takes the pinned hash for a SonarCloud token: skip this line
      uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0 trufflehog:ignore
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Run integration and E2E tests
      run: |
        npm run test:e2e

    # The image and the check of the publish workflow, before the merge
    # (lot Q1)
    - name: Build the image
      run: |
        docker build -t image-to-check .

    - name: Check the image (Trivy, environment files and keys)
      run: |
        bash scripts/scan-image.sh image-to-check

    # The image must refuse to start on a configuration it cannot run with,
    # and run on a complete one (EV-45). Placeholder values only.
    - name: Run the container smoke test
      run: |
        # Without its secrets, in production
        code=0; timeout 60 docker run --rm -e NODE_ENV=production image-to-check || code=$?
        if [ "$code" -ne 1 ]; then
          echo "Error: without its secrets, the container must stop with code 1 (got $code)"
          exit 1
        fi
        placeholders=(-e NODE_ENV=production -e DATABASE_HOST=db
          -e DATABASE_USERNAME=ci -e DATABASE_PASSWORD=ci -e DATABASE_NAME=ci
          -e NOTIFICATION_INTERNAL_TOKEN=ci-placeholder-token-of-32-characters)
        # With a port out of range
        code=0; timeout 60 docker run --rm "${placeholders[@]}" -e DATABASE_PORT=70000 image-to-check || code=$?
        if [ "$code" -ne 1 ]; then
          echo "Error: with a malformed port, the container must stop with code 1 (got $code)"
          exit 1
        fi
        # With placeholder values, it must keep running (it waits for the database)
        docker run -d --name test-app "${placeholders[@]}" image-to-check
        sleep 5
        if [ "$(docker inspect -f '{{.State.Running}}' test-app)" != "true" ]; then
          echo "Error: the container stopped on a complete configuration"
          docker logs test-app
          exit 1
        fi
        docker stop test-app
        docker rm test-app

    - name: Verify production build
      run: |
        npm run build

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
      with:
        path: ./
        # The image of the same release, not "latest": change it with the
        # SHA above when Dependabot updates the action
        version: 3.99.9
