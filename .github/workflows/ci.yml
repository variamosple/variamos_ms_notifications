name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # No lifecycle script of the dependencies runs (Husky is not needed here)
    - name: Install dependencies
      run: |
        npm ci --ignore-scripts

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies (gated by audit-exceptions.json)
      run: |
        node scripts/audit-gate.mjs

    - name: Run linter and formatter (Biome)
      run: |
        npm run lint

    # Spelling of code, docs, workflows, scripts and Docker files (American English)
    - name: Check spelling (cspell)
      run: |
        npm run spell

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    # Unused files, exports and dependencies: knip exits with an error on any finding
    - name: Find dead code (knip)
      run: |
        npm run find-deadcode

    - name: Run unit tests with the coverage thresholds
      run: |
        npm run test:cov

    # The organization's token is not given to Dependabot pull requests
    - name: Analyze with SonarCloud, coverage included
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Run integration and E2E tests
      run: |
        npm run test:e2e

    - name: Verify production build
      run: |
        npm run build

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
      with:
        path: ./
        # The image of the same release, not "latest": change it with the
        # SHA above when Dependabot updates the action
        version: 3.99.7
