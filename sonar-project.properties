# SonarCloud analysis run by the CI (build-and-test), with the coverage of
# Vitest; automatic analysis is off. Files are listed one by one, so that
# nothing else of the repository is sent.
sonar.organization=variamosple
sonar.projectKey=variamosple_variamos_ms_notifications

sonar.sources=src,scripts,Dockerfile,.github
sonar.tests=src,test
sonar.exclusions=src/**/*.spec.ts
sonar.test.inclusions=src/**/*.spec.ts,test/**

# The coverage measured by Vitest (vitest.config.ts): start-up, Nest
# modules, configuration and persistence are checked by the e2e tests,
# which report no coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/Infrastructure/Config/**,src/Infrastructure/Persistence/**,scripts/**
